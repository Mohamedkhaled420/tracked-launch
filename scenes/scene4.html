<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --t: 0s; --bg:#FFFFFF; --fg:#0A0A0A; --muted:#6B7280; --accent:#00C805; --line:#E5E7EB; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; overflow:hidden; background:var(--bg); }
  body { font-family:'Inter', system-ui, sans-serif; color:var(--fg); display:flex; align-items:center; justify-content:center; }
  .stage { width:1080px; height:1080px; position:relative; padding:96px; }

  .caption-top {
    position:absolute; top:80px; left:0; right:0; text-align:center;
    font-size:30px; font-weight:500; letter-spacing:-0.01em;
    opacity:0; transform:translateY(6px);
    animation: capIn 0.7s ease-out 0.15s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.15s);
  }
  @keyframes capIn { to { opacity:1; transform:translateY(0); } }

  .browser {
    width:100%; height:680px; margin-top:48px;
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    background:#FAFAFA; box-shadow:0 24px 60px -32px rgba(0,0,0,.18);
    display:flex; flex-direction:column;
    opacity:0; transform:translateY(8px) scale(0.998);
    animation: frameIn 0.7s cubic-bezier(.2,.7,.2,1) 0.25s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.25s);
  }
  @keyframes frameIn { to { opacity:1; transform:translateY(0) scale(1); } }

  .bar { height:44px; background:#F2F2F2; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; padding:0 16px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#E5E7EB; }
  .url { margin-left:16px; height:24px; background:#fff; border-radius:6px; border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:13px; color:#6B7280; padding:4px 10px; display:flex; align-items:center; }
  .url b { color: var(--accent); font-weight:500; }

  .body { flex:1; padding:36px 48px; background:#fff; position:relative; display:flex; flex-direction:column; }
  .body h2 { font-size:22px; font-weight:600; letter-spacing:-0.01em; margin-bottom:28px; }
  .empty-list { color:var(--muted); font-size:18px; }

  /* the click — a single ripple at the empty-list spot */
  .click {
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:18px; height:18px; border-radius:50%; background:transparent;
  }
  .click::before, .click::after {
    content:""; position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--accent);
    opacity:0; transform:scale(0.6);
  }
  .click::before {
    animation: ripple 0.7s ease-out 1.4s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 1.4s);
  }
  .click::after {
    animation: ripple 0.7s ease-out 1.55s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 1.55s);
  }
  @keyframes ripple {
    0%   { opacity:0.9; transform:scale(0.6); }
    100% { opacity:0; transform:scale(3.4); }
  }

  /* toast slides up from bottom of frame */
  .toast {
    position:absolute; left:50%; bottom:32px; transform:translate(-50%, 80px);
    background:#0A0A0A; color:#fff; padding:18px 32px; border-radius:12px;
    font-size:22px; font-weight:600; letter-spacing:-0.01em;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 18px 40px -16px rgba(0,0,0,.3);
    opacity:0;
  }
  .toast .check { width:20px; height:20px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; }
  .toast {
    animation: toastUp 0.5s cubic-bezier(.2,.7,.2,1) 1.65s forwards, toastHold 0.6s ease-out 1.65s forwards;
    animation-play-state:paused;
    animation-delay:calc(-1 * var(--t) + 1.65s);
    /* the second animation keeps it on screen — use single compound instead */
  }
  /* simpler: one animation handles slide-up + settle */
  .toast {
    animation: toastIn 0.5s cubic-bezier(.2,.7,.2,1) 1.65s forwards;
    animation-play-state:paused;
    animation-delay:calc(-1 * var(--t) + 1.65s);
  }
  @keyframes toastIn { to { opacity:1; transform:translate(-50%, 0); } }

  .caption-bottom {
    position:absolute; bottom:80px; left:0; right:0; text-align:center;
    font-size:24px; font-weight:500; color:var(--muted); letter-spacing:-0.01em;
    opacity:0; transform:translateY(6px);
    animation: capIn 0.7s ease-out 2.05s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 2.05s);
  }

  .mark {
    position:absolute; bottom:48px; right:48px;
    font-weight:600; font-size:22px; letter-spacing:0.02em; color:#0A0A0A; opacity:0.18;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="caption-top">Now you can think about other things.</div>
    <div class="browser">
      <div class="bar">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="url"><b>tracked.</b>app/list</div>
      </div>
      <div class="body">
        <h2>things i'm tracking</h2>
        <div class="empty-list">add something to track.</div>
        <div class="click"></div>
        <div class="toast"><span class="check">✓</span> Saved.</div>
      </div>
    </div>
    <div class="caption-bottom">(you can stop thinking about that thing now.)</div>
    <div class="mark">tracked.</div>
  </div>
</body>
</html>

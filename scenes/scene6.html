<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --t:0s; --bg:#0A0A0A; --fg:#FFFFFF; --accent:#00C805; --muted:rgba(255,255,255,0.55); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; overflow:hidden; background:var(--bg); }
  body { font-family:'Inter', system-ui, sans-serif; color:var(--fg); display:flex; align-items:center; justify-content:center; }
  .stage { width:1080px; height:1080px; position:relative; }

  .center {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px;
  }
  .brand {
    font-weight:700; font-size:200px; letter-spacing:-0.04em;
    opacity:0; transform:translateY(10px);
    animation: brandIn 1.0s cubic-bezier(.2,.7,.2,1) 0.15s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.15s);
  }
  .brand .dot { color:var(--accent); }
  @keyframes brandIn { to { opacity:1; transform:translateY(0); } }

  .beta {
    font-weight:500; font-size:32px; letter-spacing:-0.01em;
    opacity:0; transform:translateY(6px);
    animation: fadeUp 0.8s ease-out 0.7s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.7s);
  }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

  .vc {
    font-weight:400; font-size:22px; letter-spacing:-0.01em; color:var(--muted);
    opacity:0; transform:translateY(6px);
    animation: fadeUp 0.8s ease-out 1.5s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 1.5s);
  }

  .mark {
    position:absolute; bottom:48px; right:48px;
    font-weight:600; font-size:22px; letter-spacing:0.02em; opacity:0.32;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="center">
      <div class="brand">tracked<span class="dot">.</span></div>
      <div class="beta">Now in private beta.</div>
      <div class="vc">Backed by people you've heard of.</div>
    </div>
    <div class="mark">tracked.</div>
  </div>
</body>
</html>
